name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -n "$EC2_HOST" ] || { echo "Missing secret: EC2_HOST"; missing=1; }
          [ -n "$EC2_USER" ] || { echo "Missing secret: EC2_USER"; missing=1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "Missing secret: EC2_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Pull latest and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/Ticketing-demo"
            fi
            SERVICE_NAME="${{ secrets.EC2_SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="ticketing"
            fi

            echo "Deploying into $APP_DIR"
            cd "$APP_DIR"

            git fetch origin --tags --force
            git checkout main
            git reset --hard origin/main

            if [ -f package-lock.json ]; then
              npm ci --omit=dev
            else
              npm install --omit=dev
            fi

            if systemctl list-unit-files "${SERVICE_NAME}.service" --no-legend | grep -q "${SERVICE_NAME}.service"; then
              sudo systemctl restart "$SERVICE_NAME"
              sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            else
              echo "WARNING: systemd unit ${SERVICE_NAME}.service not found."
              echo "Install deploy/ticketing.service then: sudo systemctl enable --now ${SERVICE_NAME}"
              exit 1
            fi
