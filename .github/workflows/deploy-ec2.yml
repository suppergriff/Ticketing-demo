name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=0
          [ -n "$EC2_HOST" ] || { echo "Missing secret: EC2_HOST"; missing=1; }
          [ -n "$EC2_USER" ] || { echo "Missing secret: EC2_USER"; missing=1; }
          [ -n "$EC2_SSH_KEY" ] || { echo "Missing secret: EC2_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Pull latest and restart app
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/opt/ticketing-demo"
            fi
            SERVICE_NAME="${{ secrets.EC2_SERVICE_NAME }}"
            if [ -z "$SERVICE_NAME" ]; then
              SERVICE_NAME="ticketing-demo"
            fi

            echo "Deploying into $APP_DIR (service=$SERVICE_NAME)"
            sudo mkdir -p "$APP_DIR"
            sudo git config --system --add safe.directory "$APP_DIR" || true

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning fresh into $APP_DIR"
              sudo git clone https://github.com/suppergriff/Ticketing-demo.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            # Detached/tag-only clones need an explicit heads fetch
            sudo git fetch origin +refs/heads/*:refs/remotes/origin/* --tags --force
            sudo git checkout -f -B main origin/main
            sudo git reset --hard origin/main

            if [ -f package-lock.json ]; then
              sudo npm ci --omit=dev
            else
              sudo npm install --omit=dev
            fi

            if systemctl list-unit-files "${SERVICE_NAME}.service" --no-legend | grep -q "${SERVICE_NAME}.service"; then
              sudo systemctl restart "$SERVICE_NAME"
              sudo systemctl --no-pager --full status "$SERVICE_NAME" || true
            else
              echo "WARNING: systemd unit ${SERVICE_NAME}.service not found."
              echo "Install deploy/ticketing-demo.service then: sudo systemctl enable --now ${SERVICE_NAME}"
              exit 1
            fi

            curl -sS "http://127.0.0.1:8787/api/health" || true
            echo
